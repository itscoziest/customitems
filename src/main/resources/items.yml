items:
  # 🧨 Instant TNT
  instant_tnt:
    name: "&c&lInstant TNT"
    material: TNT
    lore:
      - "&7Explodes immediately when placed"
      - "&7No fuse delay!"
    damage: 2.2
    cooldown: 5
    combat-cap: 64
    permission: "customitems.use.instant_tnt"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "instant_tnt"
      consume: true

  # 🛡️ Force Field
  force_field:
    name: "&b&lForce Field"
    material: GLASS
    lore:
      - "&7Creates a protective glass sphere"
      - "&7around you for 10 seconds"
    radius: 5.0
    duration: 10
    cooldown: 30
    combat-cap: 32
    permission: "customitems.use.force_field"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "force_field"
      consume: true

  # ☃️ Exploding Snowman
  exploding_snowman:
    name: "&f&lExploding Snowman"
    material: PUMPKIN
    lore:
      - "&7Spawns a snowman that explodes"
      - "&7giving nearby enemies slowness"
    damage: 2
    radius: 6.6
    duration: 1.8
    cooldown: 40
    combat-cap: 16
    permission: "customitems.use.exploding_snowman"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "exploding_snowman"
      consume: true
      slowness-duration: 100
      slowness-amplifier: 2

  # 🍓 Speed Berries
  speed_berries:
    name: "&a&lSpeed Berries"
    material: SWEET_BERRIES
    lore:
      - "&7Sweet berries that make you fast"
      - "&7Gives Speed II for 30 seconds"
    duration: 30
    cooldown: 40
    combat-cap: 32
    permission: "customitems.use.speed_berries"
    allowed-regions:
      - "playarea"
    effects:
      speed:
        amplifier: 1
        duration: 30
    custom-data:
      type: "speed_berries"
      consume: true

  # 🍪 Strength Cookie
  strength_cookie:
    name: "&6&lStrength Cookie"
    material: COOKIE
    lore:
      - "&7A delicious cookie that makes"
      - "&7you incredibly strong!"
      - "&6Strength II &7for &e10 seconds"
    duration: 10
    cooldown: 30
    combat-cap: 32
    permission: "customitems.use.strength_cookie"
    allowed-regions:
      - "playarea"
    effects:
      strength:
        amplifier: 1
        duration: 10
    custom-data:
      type: "strength_cookie"
      consume: true

  # 🌀 Illusion
  illusion:
    name: "&5&lIllusion"
    material: ENDER_PEARL
    lore:
      - "&7Turn invisible and spawn"
      - "&72 decoy zombies for 7 seconds"
    duration: 7
    cooldown: 45
    combat-cap: 16
    permission: "customitems.use.illusion"
    allowed-regions:
      - "playarea"
    effects:
      invisibility:
        amplifier: 0
        duration: 5
    custom-data:
      type: "illusion"
      consume: true
      zombie-count: 2
      zombie-health: 4

  # ✊ Golem Fists
  golem_fists:
    name: "&6&lGolem Fists"
    material: IRON_INGOT
    lore:
      - "&7Launches nearby players upward"
      - "&7in a small radius"
    radius: 3.0
    range: 9.0
    cooldown: 25
    combat-cap: 64
    permission: "customitems.use.golem_fists"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "golem_fists"
      consume: true

  # 💍 Snap Ring
  snap_ring:
    name: "&d&lSnap Ring"
    material: GOLD_NUGGET
    lore:
      - "&7Spawns evoker fangs in a circle"
      - "&7around you to damage enemies"
    radius: 4.0
    damage: 12.0
    cooldown: 20
    combat-cap: 64
    permission: "customitems.use.snap_ring"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "snap_ring"
      consume: true

  # 🌬️ Super Wind Charge
  super_wind_charge:
    name: "&e&lSuper Wind Charge"
    material: WIND_CHARGE
    lore:
      - "&7Launches you much farther"
      - "&7than a normal wind charge"
    range: 15.0
    radius: 3.0
    cooldown: 16
    combat-cap: 32
    permission: "customitems.use.super_wind_charge"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "super_wind_charge"
      consume: true
      launch-power: 1.8
      upward-force: 1
      particle-count: 50
      sound-volume: 2.0

  # 🔥 Fireball
  fireball:
    name: "&c&lFireball"
    material: FIRE_CHARGE
    lore:
      - "&7Throwable fireball that explodes"
      - "&7on impact without fire"
    damage: 3.4
    cooldown: 20
    combat-cap: 32
    permission: "customitems.use.fireball"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "fireball"
      consume: true
      projectile-speed: 2.0

  # 🪵 Healing Campfire
  healing_campfire:
    name: "&a&lHealing Campfire"
    material: CAMPFIRE
    lore:
      - "&7Placeable campfire that heals"
      - "&7only you when you stand near it"
    radius: 3.0
    duration: 30
    cooldown: 60
    combat-cap: 16
    permission: "customitems.use.healing_campfire"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "healing_campfire"
      consume: true
      heal-amount: 1

  # 💣 Dynamite
  dynamite:
    name: "&c&lDynamite"
    material: RED_CANDLE
    lore:
      - "&7Throwable TNT with 4 second"
      - "&7cooldown that explodes on impact"
    damage: 2
    cooldown: 4
    combat-cap: 64
    permission: "customitems.use.dynamite"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "dynamite"
      consume: true

  # 🦘 Leap
  leap:
    name: "&a&lLeap"
    material: RABBIT_FOOT
    lore:
      - "&7Launches you 7 blocks forward"
      - "&7in the direction you're looking"
    range: 7.0
    cooldown: 30
    combat-cap: 16
    permission: "customitems.use.leap"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "leap"
      consume: true

  # 💀 Creeper
  creeper:
    name: "&2&lCreeper"
    material: LIME_CONCRETE_POWDER
    lore:
      - "&7Moves randomly for 3 seconds"
      - "&7then explodes like instant TNT"
    damage: 3.0
    duration: 2.2
    cooldown: 25
    combat-cap: 32
    permission: "customitems.use.creeper"
    allowed-regions:
      - "playarea"
    custom-data:
      type: "creeper"
      consume: true

  # 🧛 Vampire Sword
  vampire_sword:
